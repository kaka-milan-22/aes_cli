[project]
name = "encipherr-cli"
version = "1.3.7"
description = "A small AES-256-GCM file/text encryption CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13.11"
dependencies = [
    "cryptography>=46,<47",
]
[project.scripts]
encipherr = "encipherr:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["encipherr"]

[tool.pytest.ini_options]
pythonpath = ["."]
